templateVersion = "0.3.0.dev0"
answersSchema = 1
snapshot = "_sources/pythonTemplate"
overlay = "overlay"
output = "template"
include = [
  "_meta/license-questions.yml",
  "LICENSE.jinja",
  "LICENSES/pythonTemplate-MIT.txt",
  "THIRD_PARTY_NOTICES.md.jinja",

  "docker/quality-python.mk",
  "Dockerfile.quality.dockerignore",
  ".github/workflows/contribution.yml",
  "docker/coverage_report.py",
  "docker/quality.mk",
  "Dockerfile.quality",
  ".copier-answers.yml.jinja",
  ".editorconfig",
  ".gitignore",
  ".pre-commit-config.yaml",
  ".github/PULL_REQUEST_TEMPLATE.md.jinja",
  ".github/actions/actionlint/action.yml",
  ".github/ISSUE_TEMPLATE/bug.yml",
  ".github/ISSUE_TEMPLATE/feature.yml",
  ".github/workflows/ci.yml.jinja",
  ".github/workflows/release.yml.jinja",
  "AGENTS.md.jinja",
  "CONTRIBUTING.md.jinja",
  "PROJECT.md.jinja",
  "Makefile.jinja",
  "README.md.jinja",
  "pyproject.toml.jinja",
  "docs/architecture.md.jinja",
  "src/{{ packageName }}/__init__.py.jinja",
  "src/{{ packageName }}/py.typed",
  "alembic.ini.jinja",
  "migrations/env.py.jinja",
  "migrations/versions/.gitkeep",
  "tests/foundation/test_package.py.jinja",
]
allowOverride = ["README.md.jinja", "CONTRIBUTING.md.jinja", "pyproject.toml.jinja", "Makefile.jinja", "docs/architecture.md.jinja", ".github/workflows/ci.yml.jinja"]
retainBase = { "pyproject.toml.jinja" = "_base/pyproject.toml.jinja", "Makefile.jinja" = "_base/Makefile.jinja" }
smokeAnswers = { projectName = "sampleApi", withPersistence = false, withTesting = false, withCi = false }
