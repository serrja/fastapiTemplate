templateVersion = "0.1.0.dev0"
answersSchema = 1
snapshot = "_sources/pythonTemplate"
overlay = "overlay"
output = "template"
include = [
  ".copier-answers.yml.jinja",
  ".editorconfig",
  ".gitignore",
  ".pre-commit-config.yaml",
  ".github/PULL_REQUEST_TEMPLATE.md.jinja",
  ".github/workflows/ci.yml.jinja",
  "AGENTS.md.jinja",
  "CONTRIBUTING.md.jinja",
  "PROJECT.md.jinja",
  "README.md.jinja",
  "pyproject.toml.jinja",
  "docs/architecture.md.jinja",
  "src/{{ packageName }}/__init__.py.jinja",
  "src/{{ packageName }}/py.typed",
  "alembic.ini.jinja",
  "migrations/env.py.jinja",
  "migrations/versions/.gitkeep",
]
allowOverride = ["README.md.jinja", "pyproject.toml.jinja", "docs/architecture.md.jinja", ".github/workflows/ci.yml.jinja"]
retainBase = { "pyproject.toml.jinja" = "_base/pyproject.toml.jinja" }
smokeAnswers = { projectName = "sampleApi", withPersistence = false, withTesting = false, withCi = false }
