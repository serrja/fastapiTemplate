name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        persistence: [false, true]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3 # v7.1.3
        with:
          version: "0.12.15"
          enable-cache: true
      - run: uv python install 3.12
      - name: Verify pinned source and compose
        run: uv run --no-project --with 'copier==9.17.2' python _sources/pythonTemplate/tools/composeTemplate.py --repo . --smoke
      - name: Render
        run: uv run --no-project --with 'copier==9.17.2' copier copy --defaults . "$RUNNER_TEMP/rendered" -d projectName=exampleApi -d withPersistence=${{ matrix.persistence }}
      - name: Lock, lint, type, build
        working-directory: ${{ runner.temp }}/rendered
        run: |
          uv lock
          uv sync --locked --python 3.12
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked mypy
          uv build
      - name: Container build
        working-directory: ${{ runner.temp }}/rendered
        run: docker build --file Dockerfile --tag example-api:ci .
      - name: Empty suite status
        run: |
          echo 'NOT_CONFIGURED: no subject tests in new scaffold'
